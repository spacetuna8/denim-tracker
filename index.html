*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1b2a4a;--card:#15213b;--nav:#121c33;--ink:#efe6d2;--muted:#cfc6b2;--sub:#b3ab99;--copper:#d9a441;--red:#c8372d;--line:rgba(239,230,210,.14);--fill:rgba(239,230,210,.1);--edge-lo:rgba(239,230,210,.22);--edge:rgba(239,230,210,.35);--edge-hi:rgba(239,230,210,.6);--amber:#ecc36f;--on-amber:#1a1f2e;--copper-edge:rgba(217,164,65,.6);--copper-fill:rgba(217,164,65,.2);--danger-ink:#f0a59c;--nav-ink:#a39b8a;--placeholder:#9a9382;--press:#d9cdb2;--t-xs:calc(11rem / 17);--t-sm:calc(12rem / 17);--t-md:calc(14rem / 17);--t-lg:calc(16rem / 17);--t-xl:min(calc(20rem / 17), 28px);--t-2xl:min(calc(26rem / 17), 34px);--t-3xl:min(calc(36rem / 17), 44px);--t-4xl:min(calc(46rem / 17), 54px);--grid:rgba(239,230,210,.42);--s-2xs:2px;--s-xs:4px;--s-sm:8px;--s-md:12px;--s-lg:16px;--s-xl:20px;--s-2xl:24px;--s-3xl:32px;--s-4xl:48px;--r-sm:3px;--r:4px;--r-lg:6px;--on-red:#fff;--scrim:rgba(8,12,24,.7);--scrim-hi:rgba(6,9,18,.96);--press-fill:rgba(239,230,210,.06);--weave:rgba(255,255,255,.025);--shadow:0 8px 20px rgba(0,0,0,.35);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--cond:'Barlow Condensed','Arial Narrow',sans-serif}
html{background:var(--bg);font-size:17px}
/* iPhone: follow Settings → Display → Text Size. 17px is the default size, so the default look is unchanged. */
@supports (font:-apple-system-body) and (-webkit-touch-callout:none){html{font:-apple-system-body}}
body{background-color:var(--bg);background-image:repeating-linear-gradient(135deg,var(--weave) 0 2px,transparent 2px 5px);color:var(--ink);font-family:var(--mono);font-size:var(--t-md);max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}

.top{position:sticky;top:0;z-index:10;background:var(--bg);padding-top:env(safe-area-inset-top)}

.acts{display:flex;gap:var(--s-sm);padding:0 var(--s-xs) var(--s-xs)}
.btn{min-height:46px;border-radius:var(--r);font-family:var(--cond);font-weight:600;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:var(--s-sm)}
.btn.wear{flex:1;font-size:var(--t-xl);letter-spacing:.08em;border:1.5px solid var(--edge-hi)}

.detail .btn{min-height:50px}.detail .btn.wash{min-width:110px;font-size:var(--t-lg)}
.legend{display:flex;gap:var(--s-lg);margin-top:var(--s-lg);font-size:var(--t-xs);letter-spacing:.06em;color:var(--muted);flex-wrap:wrap;text-transform:uppercase}

.legend b{width:10px;height:10px;display:inline-block}
.empty{margin-top:var(--s-3xl);background:var(--card);border-radius:var(--r-lg);padding:var(--s-3xl) var(--s-2xl) var(--s-2xl);outline:1.5px dashed var(--edge);outline-offset:-7px;text-align:center}
.empty h2{font-family:var(--cond);font-size:var(--t-2xl);font-weight:700;text-transform:uppercase;margin-top:var(--s-md)}

.stack{display:flex;flex-direction:column;gap:var(--s-sm)}
.primary{min-height:50px;border-radius:var(--r);background:var(--ink);color:var(--bg);font-family:var(--cond);font-size:var(--t-xl);font-weight:700;letter-spacing:.1em;text-transform:uppercase;width:100%}
.primary:active{background:var(--press)}

.back{min-height:44px;margin-left:calc(var(--s-md) * -1);padding:0 var(--s-md);color:var(--copper);font-family:var(--cond);font-size:var(--t-lg);font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:var(--s-xs)}

.dacts{display:flex;gap:var(--s-sm);margin:var(--s-xl) 0 var(--s-2xl)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-sm)}

<body>
<div class="top"><div class="selv" aria-hidden="true"></div></div>
<main id="content"></main>
<nav aria-label="Main">
  <button data-v="col" onclick="go('col')"><i class="ph ph-stack" aria-hidden="true"></i>Rack</button>
  <button data-v="ov" onclick="go('ov')"><i class="ph ph-chart-bar" aria-hidden="true"></i>Ledger</button>
</nav>
<div id="toastWrap" role="status" aria-live="polite"><div id="toast"><span id="toast-msg"></span><button id="toast-undo" onclick="doUndo()">UNDO</button></div></div>
<div id="modal"><div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="modal-msg">
  <p id="modal-msg"></p>
  <div class="modal-btns"><button id="modal-cancel">CANCEL</button><button id="modal-ok">CONFIRM</button></div>
</div></div>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Fade photo">
  <div class="vbar"><button aria-label="Close photo" onclick="closeViewer()"><i class="ph ph-x" aria-hidden="true"></i></button><span id="vcap"></span><button aria-label="Remove this photo" onclick="viewerRemove()"><i class="ph ph-trash" aria-hidden="true"></i></button></div>
  <div class="vimg" id="vimg" role="img" aria-label="Fade photo"></div>
  <div class="vnav" id="vnav"><button id="vprev" aria-label="Older photo" onclick="stepViewer(-1)"><i class="ph ph-caret-left" aria-hidden="true"></i></button><button id="vnext" aria-label="Newer photo" onclick="stepViewer(1)"><i class="ph ph-caret-right" aria-hidden="true"></i></button></div>
</div>
<input type="file" id="importInput" accept=".json,application/json,text/plain" style="display:none" onchange="handleImport(this)">
<input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhoto(this)">

<script>
if (!Array.prototype.at) Array.prototype.at = function (i) { i = Math.trunc(i) || 0; if (i < 0) i += this.length; return this[i]; };
// Enables :active styles on iOS Safari.
document.addEventListener('touchstart', () => {}, { passive: true });
// Same storage key and {jeans:[…]} shape as the previous app, so existing data loads as-is.
const LS_KEY = 'denim_tracker_v1';
const LS_BACKUP = 'denim_tracker_v1_backup_pre_selvedge';
const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[A-Za-z0-9_.-]{1,64}$/;
const IMG_RE = /^data:image\/[a-z0-9.+-]+(?:;[a-z0-9=.-]+)*;base64,[A-Za-z0-9+/]+=*$/i;
const WASH_AT = 15;
const DAY = 86400000, HISTORY_DAYS = 365, HAPTIC_MS = 30;

let DB = { jeans: [] }, CUR = { view: 'col', id: null }, PREV = 'col', FS = { editId: null };
const currency = 'CHF';
let sortMode = 'alpha', ovSort = 'alpha', ovBrand = '', BRANDS = [], photoIdx = null, viewerOpener = null;
let S = {}, scrollPos = {}, lastKey = null, UNDO = null, toastT = null, LOAD_OK = false;

// ── Dates ──
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => iso(new Date());
// Home-screen apps stay suspended in the background; redraw when reopened on a new day.
let shownDay = today();
const checkDay = () => { if (document.visibilityState === 'visible' && today() !== shownDay && CUR.view !== 'form') render(); };
document.addEventListener('visibilitychange', checkDay);
window.addEventListener('pageshow', checkDay);
setInterval(checkDay, 60000);
const noon = s => new Date(s + 'T12:00:00');
const shift = (s, n) => { const d = noon(s); d.setDate(d.getDate() + n); return iso(d); };
const between = (a, b) => Math.round((noon(b) - noon(a)) / DAY);
const daysSince = s => s ? between(s, today()) : null;
const fmt = s => noon(s).toLocaleDateString('en', { month: 'short', day: 'numeric', year: 'numeric' });
const fmtShort = s => noon(s).toLocaleDateString('en', { month: 'short', year: '2-digit' });
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const word = (n, one, many = one + 's') => n === 1 ? one : many;
const byName = (a, b) => (a.brand + ' ' + a.model).localeCompare(b.brand + ' ' + b.model);
const NUM_INT = new Intl.NumberFormat('de-CH', { maximumFractionDigits: 0 }), NUM_DEC = new Intl.NumberFormat('de-CH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = n => (Number.isInteger(n) ? NUM_INT : NUM_DEC).format(n);
const money = n => currency + ' ' + num(n);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const haptic = () => { try { navigator.vibrate && navigator.vibrate(HAPTIC_MS); } catch (e) {} };
const clone = j => JSON.parse(JSON.stringify(j));

// ── Storage ──
// Lenient: never drops a pair from existing data; only normalises shape.
// Ids and photo sources are interpolated into markup, so anything not matching a strict pattern is replaced or dropped.
function normalize(p) {
  if (!p || typeof p !== 'object') return null;
  const dates = a => Array.isArray(a) ? [...new Set(a.filter(d => typeof d === 'string' && ISO_RE.test(d)))].sort() : [];
  const price = Number(p.price);
  // A photo either carries its image inline (old data, imports) or only a date, with the image in IndexedDB.
  const photos = Array.isArray(p.photos) ? p.photos.filter(x => x && ISO_RE.test(x.date || '') && (x.src === undefined || (typeof x.src === 'string' && IMG_RE.test(x.src)))).map(x => x.src ? { date: x.date, src: x.src } : { date: x.date }).sort((a, b) => a.date.localeCompare(b.date)) : [];
  return { ...p, id: typeof p.id === 'string' && ID_RE.test(p.id) ? p.id : uid(),
    brand: String(p.brand ?? '').trim() || 'Unknown brand', model: String(p.model ?? '').trim() || 'Unnamed pair',
    purchaseDate: typeof p.purchaseDate === 'string' && ISO_RE.test(p.purchaseDate) ? p.purchaseDate : '',
    price: Number.isFinite(price) && price > 0 ? price : null, wears: dates(p.wears), washes: dates(p.washes), photos };
}
function load() {
  let raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch (e) {}
  // One-time untouched copy of the old data before this version ever writes.
  try { if (raw && !localStorage.getItem(LS_BACKUP)) localStorage.setItem(LS_BACKUP, raw); } catch (e) {}
  let data = null;
  try { data = JSON.parse(raw || '{"jeans":[]}'); LOAD_OK = raw !== null; }
  catch (e) { try { localStorage.setItem(LS_KEY + '_unreadable', raw); } catch (e2) {} } // keep it so the next save can't destroy it
  const arr = Array.isArray(data) ? data : data && Array.isArray(data.jeans) ? data.jeans : [];
  DB = { ...(data && !Array.isArray(data) ? data : {}), jeans: arr.map(normalize).filter(Boolean) };
  const seen = new Set(); DB.jeans.forEach(j => { if (seen.has(j.id)) j.id = uid(); seen.add(j.id); });
  try {
    const s = localStorage.getItem('dt_sort'); if (['alpha', 'mostworn', 'lastworn'].includes(s)) sortMode = s;
  } catch (e) {}
}
function save() {
  const data = JSON.stringify(DB);
  try { localStorage.setItem(LS_KEY, data); return true; }
  catch (e) {
    // Out of space: free the one-time pre-update backup and retry once.
    try { if (localStorage.getItem(LS_BACKUP)) { localStorage.removeItem(LS_BACKUP); localStorage.setItem(LS_KEY, data); return true; } } catch (e2) {}
    toast('Storage full — export your data now', null, 4000); return false;
  }
}
function setPref(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} }

// ── Photo store (IndexedDB: far more room than localStorage's ~5 MB) ──
const PDB_NAME = 'denim_tracker_photos', PSTORE = 'photos';
// PHOTOS holds image Blobs (stored as files, not loaded into memory as text). Inline p.src data URLs are only a fallback.
let pdb = null, PHOTOS_READY = false; const PHOTOS = new Map(), URLS = new Map();
const pkey = (id, date) => id + '|' + date;
const photoData = (j, p) => p.src || PHOTOS.get(pkey(j.id, p.date)) || null;
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
const asDataURL = v => typeof v === 'string' ? Promise.resolve(v) : blobToDataURL(v);
function dataURLToBlob(d) {
  const comma = d.indexOf(','), type = d.slice(5, d.indexOf(';')), bin = atob(d.slice(comma + 1)), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type });
}
// Rendering uses cached object URLs so each re-render doesn't re-parse full images as text.
function photoURL(j, p) {
  const src = photoData(j, p); if (!src) return '';
  const k = pkey(j.id, p.date), hit = URLS.get(k);
  if (hit && hit.src === src) return hit.url;
  if (hit) URL.revokeObjectURL(hit.url);
  try { const url = URL.createObjectURL(typeof src === 'string' ? dataURLToBlob(src) : src); URLS.set(k, { src, url }); return url; } catch (e) { return typeof src === 'string' ? src : ''; }
}
function openPDB() {
  return new Promise((res, rej) => {
    if (!('indexedDB' in window)) return rej(new Error('no indexedDB'));
    const r = indexedDB.open(PDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(PSTORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
  });
}
function ptx(mode, fn) {
  return new Promise((res, rej) => {
    const t = pdb.transaction(PSTORE, mode); fn(t.objectStore(PSTORE));
    t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const putPhotos = entries => ptx('readwrite', s => entries.forEach(([k, v]) => s.put(v, k)));
const delPhotos = keys => ptx('readwrite', s => keys.forEach(k => s.delete(k)));
function loadAllPhotos() {
  return ptx('readonly', s => { const r = s.openCursor(); r.onsuccess = () => { const c = r.result; if (c) { PHOTOS.set(c.key, c.value); c.continue(); } }; });
}
// Older versions stored images in IndexedDB as text; convert them to Blobs once. On failure the text copies stay and still show.
async function upgradeStoredPhotos() {
  const entries = [];
  PHOTOS.forEach((v, k) => { if (typeof v === 'string') { try { entries.push([k, dataURLToBlob(v)]); } catch (e) {} } });
  if (!entries.length) return;
  await putPhotos(entries);
  entries.forEach(([k, b]) => PHOTOS.set(k, b));
}
// Move inline images into IndexedDB as Blobs; the inline copy is only dropped after the write is confirmed.
async function migratePhotos(persist = true) {
  const entries = [];
  DB.jeans.forEach(j => j.photos.forEach(p => { if (p.src) { try { entries.push([pkey(j.id, p.date), dataURLToBlob(p.src)]); } catch (e) {} } }));
  if (!entries.length) return;
  await putPhotos(entries);
  const done = new Set(entries.map(([k]) => k));
  entries.forEach(([k, v]) => PHOTOS.set(k, v));
  DB.jeans.forEach(j => j.photos.forEach(p => { if (done.has(pkey(j.id, p.date))) delete p.src; }));
  if (persist) save();
}
// Images whose pair or photo was deleted are removed on the next launch, so Undo keeps working during a session.
function gcPhotos() {
  const live = new Set(); DB.jeans.forEach(j => j.photos.forEach(p => live.add(pkey(j.id, p.date))));
  const dead = [...PHOTOS.keys()].filter(k => !live.has(k));
  if (dead.length) delPhotos(dead).then(() => dead.forEach(k => PHOTOS.delete(k))).catch(() => {});
}

// ── Stats ──
// Unworn days are outlined (3:1 against the card) rather than filled, so the red wash bar stays visible on them.
const cell = (worn, washed, future, isToday) => ({
  bg: worn && !future ? 'var(--ink)' : 'transparent',
  ring: [washed && 'inset 0 -3px 0 var(--red)', !worn && !future && 'inset 0 0 0 1px var(--grid)', isToday && '0 0 0 1.5px var(--copper)'].filter(Boolean).join(', ') || 'none'
});
function stats(j) {
  const t = today(), ws = j.wears, wa = j.washes, W = new Set(ws), A = new Set(wa);
  const lastWear = ws.at(-1) || null, lastWash = wa.at(-1) || null;
  const since = lastWash ? ws.filter(d => d > lastWash).length : ws.length;
  let streak = 0;
  if (lastWear && daysSince(lastWear) <= 1) { streak = 1; for (let i = ws.length - 1; i > 0; i--) { if (between(ws[i - 1], ws[i]) === 1) streak++; else break; } }
  const dw = daysSince(lastWash), lw = daysSince(lastWear);
  const strip = []; let worn14 = 0;
  for (let k = 13; k >= 0; k--) { const d = shift(t, -k); if (W.has(d)) worn14++; strip.push(cell(W.has(d), A.has(d), false, k === 0)); }
  return { W, A, lastWear, lastWash, since, streak, strip, worn14, total: ws.length, washes: wa.length,
    wpw: wa.length ? Math.round(ws.length / wa.length) : '—', wornToday: W.has(t), washedToday: A.has(t),
    due: since >= WASH_AT,
    wornLabel: !lastWear ? 'Never worn' : lw <= 0 ? 'Worn today' : lw === 1 ? 'Worn yesterday' : `Worn ${lw} days ago`,
    washLabel: dw === null ? 'Never washed' : dw <= 0 ? 'Washed today' : dw === 1 ? 'Washed yesterday' : `Washed ${dw} days ago`,
    badge: lastWash ? since + ' since wash' : 'Unwashed',
    cpw: j.price && ws.length ? j.price / ws.length : null };
}
function calendar(s) {
  const t = today(), dow = (new Date().getDay() + 6) % 7, start = shift(t, -(17 * 7 + dow)), weeks = []; let worn = 0;
  for (let w = 0; w < 18; w++) { const col = []; for (let d = 0; d < 7; d++) { const day = shift(start, w * 7 + d); if (s.W.has(day) && day <= t) worn++; col.push(cell(s.W.has(day), s.A.has(day), day > t, day === t)); } weeks.push(col); }
  return { weeks, worn };
}
const cellsHTML = cells => cells.map(c => `<i style="background:${c.bg};box-shadow:${c.ring}"></i>`).join('');

// ── UI helpers ──
function toast(msg, undo = null, ms = 1800, label = 'UNDO') {
  const el = document.getElementById('toast'), btn = document.getElementById('toast-undo');
  document.getElementById('toast-msg').textContent = msg;
  btn.style.display = undo ? '' : 'none'; btn.textContent = label;
  UNDO = undo; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => { el.classList.remove('show'); UNDO = null; }, undo ? Math.max(ms, 4500) : ms);
}
function doUndo() { const u = UNDO; UNDO = null; clearTimeout(toastT); document.getElementById('toast').classList.remove('show'); u && u(); }
function showConfirm(msg, okLabel = 'Confirm') {
  return new Promise(resolve => {
    const modal = document.getElementById('modal'), ok = document.getElementById('modal-ok'), cancel = document.getElementById('modal-cancel');
    const opener = document.activeElement;
    document.getElementById('modal-msg').textContent = msg; ok.textContent = okLabel.toUpperCase(); modal.classList.add('open'); ok.focus();
    const done = r => { modal.classList.remove('open'); ok.onclick = cancel.onclick = null; document.removeEventListener('keydown', onKey); if (opener && opener.isConnected) opener.focus({ preventScroll: true }); resolve(r); };
    const onKey = e => { if (e.key === 'Escape') done(false); else trapTab(e, modal); };
    document.addEventListener('keydown', onKey);
    ok.onclick = () => done(true); cancel.onclick = () => done(false);
  });
}
// Keep Tab focus inside an open dialog.
function trapTab(e, root) {
  if (e.key !== 'Tab') return;
  const f = [...root.querySelectorAll('button:not([disabled])')].filter(b => b.offsetParent !== null && getComputedStyle(b).visibility !== 'hidden'); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
const seg = (label, opts, cur, fn) => `<div class="seg" role="group" aria-label="${label}">${opts.map(([v, l]) => `<button class="${cur === v ? 'on' : ''}" aria-pressed="${cur === v}" onclick="${fn}('${v}')">${l}</button>`).join('')}</div>`;
const findJ = id => DB.jeans.find(x => x.id === id);
function restore(snapshot) { const i = DB.jeans.findIndex(x => x.id === snapshot.id); const prev = DB.jeans.slice(); if (i >= 0) DB.jeans[i] = snapshot; else DB.jeans.push(snapshot); if (!save()) { DB.jeans = prev; return render(); } toast('Undone'); render(); }
// After a failed save: storage still holds the previous state, so only revert memory.
function rollback(snapshot) { const i = DB.jeans.findIndex(x => x.id === snapshot.id); if (i >= 0) DB.jeans[i] = snapshot; else DB.jeans.push(snapshot); render(); }

// ── Navigation ──
function go(view, id = null) {
  if ((view === 'detail' || view === 'form') && (CUR.view === 'col' || CUR.view === 'ov')) PREV = CUR.view;
  if (view === 'col' || view === 'ov') PREV = view;
  CUR = { view, id };
  document.querySelectorAll('nav button').forEach(b => {
    const on = b.dataset.v === view || (b.dataset.v === PREV && (view === 'detail' || view === 'form'));
    b.classList.toggle('active', on);
    b.querySelector('i').className = (on ? 'ph-fill ph-' : 'ph ph-') + (b.dataset.v === 'col' ? 'stack' : 'chart-bar');
    if (b.dataset.v === view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  const changed = lastKey !== null && lastKey !== view + (id || '');
  render();
  if (changed) document.querySelector('#content h1')?.focus({ preventScroll: true });
}
function goBack() { if (CUR.view === 'form' && FS.editId) go('detail', FS.editId); else go(PREV); }
function openForm(editId) { FS = { editId }; go('form', editId); }

// ── Render ──
function render() {
  const key = CUR.view + (CUR.id || '');
  shownDay = today();
  if (lastKey !== null) scrollPos[lastKey] = window.scrollY;
  S = {}; DB.jeans.forEach(j => { S[j.id] = stats(j); });
  const c = document.getElementById('content');
  c.innerHTML = CUR.view === 'ov' ? renderLedger() : CUR.view === 'detail' ? renderDetail() : CUR.view === 'form' ? renderForm() : renderRack();
  const y = lastKey === key ? scrollPos[key] || 0 : CUR.view === 'detail' || CUR.view === 'form' ? 0 : scrollPos[key] || 0;
  requestAnimationFrame(() => window.scrollTo(0, y));
  lastKey = key;
}

function wearBtn(j, s) {
  return `<button class="btn wear ${s.wornToday ? 'on' : ''}" aria-pressed="${s.wornToday}" aria-label="Worn today: ${esc(j.brand + ' ' + j.model)}" onclick="event.stopPropagation();toggleToday('${j.id}','wears')"><i class="${s.wornToday ? 'ph-fill ph-check-circle' : 'ph ph-check'}" aria-hidden="true"></i>${s.wornToday ? 'Worn today' : 'Wear today'}</button>`;
}
function washBtn(j, s) {
  return `<button class="btn wash ${s.washedToday ? 'on' : ''}" aria-pressed="${s.washedToday}" aria-label="Washed today: ${esc(j.brand + ' ' + j.model)}" onclick="event.stopPropagation();toggleToday('${j.id}','washes')"><i class="${s.washedToday ? 'ph-fill ph-drop' : 'ph ph-drop'}" aria-hidden="true"></i>${s.washedToday ? 'Washed' : 'Wash'}</button>`;
}
const openAttrs = (j, s) => `role="button" tabindex="0" aria-label="Open ${esc(j.brand + ' ' + j.model)}, ${plural(s.total, 'wear')}" onclick="go('detail','${j.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('detail','${j.id}')}"`;

function renderRack() {
  const n = DB.jeans.length, totalW = DB.jeans.reduce((a, j) => a + j.wears.length, 0);
  let h = `<div class="headrow"><div><div class="eyebrow">${plural(n, 'pair')} · ${plural(totalW, 'wear')}</div><h1 class="h1" tabindex="-1">The Rack</h1></div>
    <button class="iconbtn" aria-label="Add a pair" onclick="openForm(null)"><i class="ph ph-plus" aria-hidden="true"></i></button></div>`;
  if (!n) return h + `<div class="empty"><i class="ph ph-coat-hanger" aria-hidden="true" style="font-size:var(--t-3xl);color:var(--copper)"></i>
    <h2>Nothing on the rack yet</h2><p>Add your first pair to start logging wears and washes.</p>
    <div class="stack"><button class="primary" onclick="openForm(null)">Add a pair</button><button class="ghost" onclick="document.getElementById('importInput').click()">Import JSON backup</button></div></div>`;
  const list = [...DB.jeans];
  if (sortMode === 'mostworn') list.sort((a, b) => b.wears.length - a.wears.length || byName(a, b));
  else if (sortMode === 'lastworn') list.sort((a, b) => (S[b.id].lastWear || '').localeCompare(S[a.id].lastWear || '') || byName(a, b));
  else list.sort(byName);

  h += list.map(j => {

function openViewer(i) {
  const j = findJ(CUR.id); if (!j || !j.photos[i]) return;
  if (photoIdx !== i) resetZoom();
  photoIdx = i; const p = j.photos[i], n = j.wears.filter(x => x <= p.date).length;

  document.getElementById('vnext').disabled = i === j.photos.length - 1;
  const v = document.getElementById('viewer'), wasOpen = v.classList.contains('open');

}
function closeViewer() { const wasOpen = photoIdx != null; photoIdx = null; resetZoom(); document.getElementById('viewer').classList.remove('open'); document.body.style.overflow = ''; if (wasOpen) { const o = viewerOpener && viewerOpener.isConnected ? viewerOpener : document.querySelector('.photos .add'); o?.focus({ preventScroll: true }); } viewerOpener = null; }
function stepViewer(d) { const j = findJ(CUR.id); if (j && photoIdx != null) openViewer(Math.max(0, Math.min(j.photos.length - 1, photoIdx + d))); }
async function viewerRemove() { const j = findJ(CUR.id); if (!j || photoIdx == null) return; const p = j.photos[photoIdx]; closeViewer(); await removePhoto(j.id, p.date); }
// Viewer gestures: pinch to zoom (1–5×), drag to pan when zoomed, double-tap to toggle 2.5×,
// swipe to change photo and single tap to close only when not zoomed.
let resetZoom = () => {};
(() => {
  const v = document.getElementById('viewer'), im = document.getElementById('vimg');
  let z = { s: 1, x: 0, y: 0 }, g = null, moved = false, tapT = null, lastTouch = 0;
  const apply = () => { im.style.transform = z.s === 1 ? '' : `translate(${z.x}px,${z.y}px) scale(${z.s})`; };
  const clamp = () => { const mx = im.offsetWidth * (z.s - 1) / 2, my = im.offsetHeight * (z.s - 1) / 2; z.x = Math.max(-mx, Math.min(mx, z.x)); z.y = Math.max(-my, Math.min(my, z.y)); };
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const one = t => ({ k: z.s > 1 ? 'pan' : 'swipe', x0: t.clientX, y0: t.clientY, x: z.x, y: z.y });
  resetZoom = () => { z = { s: 1, x: 0, y: 0 }; clearTimeout(tapT); tapT = null; apply(); };
  im.addEventListener('touchstart', e => { const t = e.touches; if (t.length === 1) moved = false; g = t.length === 2 ? { k: 'pinch', d: dist(t) || 1, s: z.s } : one(t[0]); }, { passive: true });
  im.addEventListener('touchmove', e => {
    if (!g) return; const t = e.touches;
    if (g.k === 'pinch' && t.length === 2) { z.s = Math.max(1, Math.min(5, g.s * dist(t) / g.d)); clamp(); apply(); moved = true; }
    else if (g.k === 'pan' && t.length === 1) { z.x = g.x + t[0].clientX - g.x0; z.y = g.y + t[0].clientY - g.y0; clamp(); apply(); moved = true; }
    else if (g.k === 'swipe' && t.length === 1 && Math.abs(t[0].clientX - g.x0) > 10) moved = true;
  }, { passive: true });
  im.addEventListener('touchend', e => {
    lastTouch = Date.now(); if (!g) return;
    const end = e.changedTouches[0];
    if (g.k === 'swipe' && e.touches.length === 0 && end && Math.abs(end.clientX - g.x0) > 50) { stepViewer(end.clientX < g.x0 ? 1 : -1); g = null; return; }
    if (e.touches.length === 1) { g = one(e.touches[0]); return; }
    g = null; if (moved) return;
    if (tapT) { clearTimeout(tapT); tapT = null; if (z.s > 1) z = { s: 1, x: 0, y: 0 }; else z.s = 2.5; apply(); }
    else tapT = setTimeout(() => { tapT = null; if (z.s === 1) closeViewer(); }, 280);
  }, { passive: true });
  im.addEventListener('click', () => { if (Date.now() - lastTouch > 700) closeViewer(); }); // mouse only
  document.addEventListener('keydown', e => { if (!v.classList.contains('open')) return; if (document.getElementById('modal').classList.contains('open')) return; if (e.key === 'Escape') closeViewer(); else if (e.key === 'ArrowLeft') stepViewer(-1); else if (e.key === 'ArrowRight') stepViewer(1); else trapTab(e, v); });
})();

function toggleToday(id, key) {

  const snap = clone(j), t = today(), had = j[key].includes(t);
  j[key] = had ? j[key].filter(d => d !== t) : [...j[key], t].sort();
  if (!save()) return rollback(snap);

  toast(`${key === 'wears' ? 'Wear' : 'Wash'} ${had ? 'removed' : 'logged'} · ${j.model}`, () => restore(snap));
}
function addLog(id, key) {

  if (!d || !ISO_RE.test(d)) return toast('Pick a date first');

async function removeLast(id, key) {

  if (!await showConfirm(`Remove ${fmt(last)} from ${key === 'wears' ? 'wear' : 'wash'} log?`, 'Remove')) return;
  const snap = clone(j); j[key] = j[key].filter(d => d !== last);

async function delJeans(id) {
  if (!await showConfirm('Delete this pair? This cannot be undone.', 'Delete')) return;
  const prev = DB.jeans; DB.jeans = DB.jeans.filter(x => x.id !== id);
  if (!save()) { DB.jeans = prev; return; }
  toast('Deleted'); delete scrollPos.col; go(PREV);
}

function genDates(count, from, to) {
  const span = between(from, to) + 1;
  if (count <= 0 || span <= 0) return [];
  const n = Math.min(count, span);
  if (n === 1) return [to];
  return Array.from({ length: n }, (_, i) => shift(from, Math.round(i * (span - 1) / (n - 1))));
}

async function saveForm() {
  const t = today(), val = id => document.getElementById(id)?.value ?? '';
  const brand = val('fBrand').trim(), model = val('fModel').trim(), date = val('fDate'), priceRaw = String(val('fPrice')).trim();
  if (!brand || !model) { document.getElementById(brand ? 'fModel' : 'fBrand')?.focus(); return toast('Brand and model are required'); }
  if (date && !ISO_RE.test(date)) return toast('Purchase date is invalid');
  if (date && date > t) return toast("Purchase date can't be in the future");
  const price = priceRaw === '' ? null : Number(priceRaw);
  if (price !== null && (!Number.isFinite(price) || price < 0)) return toast('Price must be 0 or more');
  const int = id => { const v = String(val(id)).trim(); if (v === '') return null; const n = parseInt(v, 10); return Number.isFinite(n) ? n : NaN; };

  if (FS.editId) {
    const j = findJ(FS.editId); if (!j) return go('col');
    const snap = clone(j);
    const n = int('editSince');
    if (Number.isNaN(n) || (n !== null && n < 0)) return toast('Wears since wash must be 0 or more');
    if (n !== null) {
      // Regenerated wears end yesterday, or today if today is already logged, so the count never adds a wear for today.
      const lastWash = j.washes.at(-1) || null, end = j.wears.includes(t) ? t : shift(t, -1);
      const start = lastWash ? shift(lastWash, 1) : (date || j.purchaseDate || shift(t, -HISTORY_DAYS));
      const avail = Math.max(0, between(start, end) + 1);
      let final = n;
      if (n > avail) { if (!await showConfirm(`Only ${plural(avail, 'day')} available. The count will be capped at ${avail}. Continue?`, 'Continue')) return; final = avail; }
      const before = lastWash ? j.wears.filter(d => d <= lastWash) : [];
      j.wears = [...new Set([...before, ...genDates(final, start, end)])].sort();
    }
    Object.assign(j, { brand, model, purchaseDate: date || '', price: price || null });
    if (!save()) return rollback(snap);
    toast('Saved'); return go('detail', j.id);
  }
  const nW = int('bfWears') ?? 0, nA = int('bfWashes') ?? 0, nS = int('bfSince') ?? 0;
  if ([nW, nA, nS].some(x => Number.isNaN(x) || x < 0)) return toast('Backfill numbers must be 0 or more');
  if (nS > nW) return toast("Since wash can't exceed past wears");
  if (nA === 0 && nS > 0 && nS !== nW) return toast('With no washes, since wash equals past wears');
  const from = date || shift(t, -HISTORY_DAYS), yest = shift(t, -1);
  let washes, wears;
  if (nA > 0 && nS > 0) {
    const mid = shift(from, Math.floor(between(from, t) / 2));
    washes = genDates(nA, from, mid); const lw = washes.at(-1) || mid;
    wears = [...genDates(nW - nS, from, shift(lw, -1)), ...genDates(nS, shift(lw, 1), yest)];
  } else { washes = genDates(nA, from, yest); wears = genDates(nW, from, yest); } // backfill never logs today; the Wear/Wash buttons own today
  const j = { id: uid(), brand, model, purchaseDate: date || '', price: price || null, wears: [...new Set(wears)].sort(), washes, photos: [] };
  DB.jeans.push(j);
  if (!save()) { DB.jeans.pop(); return; }
  go('detail', j.id);
  const short = [];
  if (j.wears.length < nW) short.push(`${j.wears.length} of ${nW} wears`);
  if (washes.length < nA) short.push(`${washes.length} of ${nA} washes`);
  toast(short.length ? `Added · only ${short.join(', ')} fit the date range` : 'Added to the rack', null, short.length ? 3600 : 1800);
}

// ── Photos (images in IndexedDB; inline in the pair only as a fallback) ──
function resizeImage(file, max = 640, quality = 0.7, asBlob = false) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      if (!asBlob) return res(c.toDataURL('image/jpeg', quality));
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
async function handlePhoto(input) {
  const file = input.files[0]; input.value = '';
  const j = findJ(CUR.id); if (!file || !j) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif|jpe?g|png|webp)$/i.test(file.name)) return toast('Choose an image file');
  // With IndexedDB there is room for sharper photos; the localStorage fallback keeps them small.
  let img; try { img = pdb ? await resizeImage(file, 1440, 0.82, true) : await resizeImage(file); } catch (e) { return toast('Could not read that image'); }
  const snap = clone(j), d = today(), key = pkey(j.id, d);
  let entry = null, stored = false; const prevSrc = PHOTOS.get(key);
  if (pdb) { try { await putPhotos([[key, img]]); PHOTOS.set(key, img); entry = { date: d }; stored = true; } catch (e) { /* fall back to inline */ } }
  if (!entry) { try { entry = { date: d, src: await asDataURL(img) }; } catch (e) { return toast('Could not read that image'); } }
  const replaced = j.photos.some(p => p.date === d);
  j.photos = [...j.photos.filter(p => p.date !== d), entry].sort((a, b) => a.date.localeCompare(b.date));
  if (!save()) {
    // Put back the image this one overwrote, so the restored entry still shows the old photo.
    if (stored) { (prevSrc ? putPhotos([[key, prevSrc]]) : delPhotos([key])).catch(() => {}); if (prevSrc) PHOTOS.set(key, prevSrc); else PHOTOS.delete(key); }
    return rollback(snap);
  }
  render(); toast(replaced ? 'Photo replaced · one per day' : 'Photo added');
}
async function removePhoto(id, date) {
  const j = findJ(id); if (!j) return;
  if (!await showConfirm(`Remove the photo from ${fmt(date)}?`, 'Remove')) return;
  const snap = clone(j); j.photos = j.photos.filter(p => p.date !== date);
  if (!save()) return rollback(snap);
  render(); toast('Photo removed', () => restore(snap));
}

// ── Export / Import ──
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
// iPhone home-screen apps can't save blob downloads reliably; use the share sheet (Save to Files) when available.
async function deliver(name, text, type, done = '') {
  try {
    const file = new File([text], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return true; }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
    // Preparing photos can outlast the tap that started the export; iOS then needs one more tap to open the share sheet.
    if (e && e.name === 'NotAllowedError') { toast('Backup ready', () => deliver(name, text, type, done).then(ok => ok && done && toast(done)), 10000, 'SAVE'); return false; }
  }
  download(name, text, type); return true;
}
// Backups always embed the images, so they restore on any device.
async function exportData() {
  const one = async (j, p) => { const v = photoData(j, p); if (!v) return null; try { return { date: p.date, src: await asDataURL(v) }; } catch (e) { return null; } };
  const jeans = await Promise.all(DB.jeans.map(async j => ({ ...j, photos: (await Promise.all(j.photos.map(p => one(j, p)))).filter(Boolean) })));
  return { ...DB, jeans };
}
async function exportJSON() {
  const data = await exportData(), count = list => list.reduce((a, j) => a + j.photos.length, 0), missing = count(DB.jeans) - count(data.jeans);
  const msg = missing ? `JSON exported · ${plural(missing, 'photo')} unavailable` : 'JSON exported';
  if (await deliver('denim-tracker-backup-' + today() + '.json', JSON.stringify(data, null, 2), 'application/json', msg)) toast(msg, null, missing ? 3600 : 1800);
}
function exportCSV() {
  // Quote per RFC 4180; prefix formula-like cells so spreadsheets don't execute them.
  const q = v => { let s = v == null ? '' : String(v); if (/^[=+\-@\t\r]/.test(s) && !/^-?\d/.test(s)) s = "'" + s; return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const rows = [['brand', 'model', 'purchase_date', 'price', 'currency', 'event', 'date']];
  DB.jeans.forEach(j => {
    const ev = [...j.wears.map(d => ['wear', d]), ...j.washes.map(d => ['wash', d])].sort((a, b) => a[1].localeCompare(b[1]));
    if (!ev.length) rows.push([j.brand, j.model, j.purchaseDate, j.price, currency, '', '']);
    ev.forEach(([e, d]) => rows.push([j.brand, j.model, j.purchaseDate, j.price, currency, e, d]));
  });
  deliver('denim-tracker-' + today() + '.csv', '\ufeff' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv').then(ok => ok && toast('CSV exported'));
}
function handleImport(input) {
  const file = input.files[0]; input.value = ''; if (!file) return;
  file.text().then(async txt => {
    let data; try { data = JSON.parse(txt); } catch (e) { return toast('Not a valid JSON file'); }
    const arr = Array.isArray(data) ? data : data && Array.isArray(data.jeans) ? data.jeans : null;
    if (!arr) return toast('No pairs found in file');
    const jeans = arr.map(normalize).filter(Boolean);
    if (!jeans.length) return toast('No valid pairs found in file');
    const seen = new Set(); jeans.forEach(j => { if (seen.has(j.id)) j.id = uid(); seen.add(j.id); });
    if (DB.jeans.length && !await showConfirm(`Replace your ${plural(DB.jeans.length, 'pair')} with ${plural(jeans.length, 'pair')} from this backup?`, 'Replace')) return;
    const prev = DB; DB = { ...(Array.isArray(data) ? {} : data), jeans };
    const keys = []; jeans.forEach(j => j.photos.forEach(p => { if (p.src) keys.push(pkey(j.id, p.date)); }));
    const before = new Map(keys.filter(k => PHOTOS.has(k)).map(k => [k, PHOTOS.get(k)]));
    // Move images into IndexedDB first, so a photo-heavy backup doesn't overflow localStorage on save.
    if (pdb) { try { await migratePhotos(false); } catch (e) { /* keep inline; save below decides */ } }
    if (!save()) {
      DB = prev;
      // Undo the image writes so existing pairs keep their own photos.
      if (pdb && keys.length) {
        const added = keys.filter(k => !before.has(k));
        try { if (before.size) await putPhotos([...before]); if (added.length) await delPhotos(added); } catch (e) {}
        before.forEach((v, k) => PHOTOS.set(k, v)); added.forEach(k => PHOTOS.delete(k));
      }
      return render();
    }
    toast('Backup restored'); delete scrollPos.col; go('col');
  }, () => toast('Could not read file'));
}

if ('serviceWorker' in navigator) {
  // Reload once when a new version takes over, so the update shows without a second launch.
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  const reloadWhenSafe = () => { if (reloaded) return; if (CUR.view === 'form') return setTimeout(reloadWhenSafe, 2000); reloaded = true; location.reload(); };
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadWhenSafe(); });
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(() => {});
}

async function init() {
  load(); go('col');
  try { pdb = await openPDB(); await loadAllPhotos(); } catch (e) { pdb = null; PHOTOS_READY = true; render(); return; }
  try { await upgradeStoredPhotos(); } catch (e) {}
  // Migration failures leave photos inline (still visible); the store stays usable.
  // Cleanup only runs when the saved data was read successfully, so a failed read can never delete photos.
  try { await migratePhotos(); if (LOAD_OK && DB.jeans.length) gcPhotos(); } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  PHOTOS_READY = true; render();
}
init();
